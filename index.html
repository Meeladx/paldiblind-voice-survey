<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>استبيان الصوت - بالدي بلايند</title>
<style>
  :root { --bg:#000; --fg:#fff; --btn:#ffd400; --btn-fg:#000; --btn2:#1c1c1c; --line:#fff; --focus:#4fc3f7; --warn:#ffb4a8; }
  html { font: -apple-system-body; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
         font-size: 1.25rem; line-height: 1.55; }
  main { max-width: 40rem; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.8rem; line-height: 1.35; margin: 8px 0 16px; }
  h1:focus { outline: 3px solid var(--focus); outline-offset: 4px; }
  p { margin: 0 0 16px; }
  button, .btn { display: block; box-sizing: border-box; width: 100%; min-height: 72px; margin: 0 0 16px;
         padding: 16px; font: inherit; font-size: 1.5rem; font-weight: 700; line-height: 1.3;
         border: 3px solid var(--line); border-radius: 14px; background: var(--btn2); color: var(--fg);
         text-align: center; text-decoration: none; cursor: pointer; touch-action: manipulation; }
  .primary { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
  .huge { min-height: 42vh; font-size: 2rem; }
  .huge.recording { background: #c62828; color: #fff; border-color: #ff8a80; }
  [aria-disabled="true"] { opacity: .45; }
  button:focus-visible, .btn:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  .say { font-size: 2rem; font-weight: 700; line-height: 1.35; border: 2px dashed var(--line);
         border-radius: 12px; padding: 12px 14px; }
  .rec { font-size: 1.6rem; font-weight: 700; color: #ff5a5a; text-align: center; }
  .warn { color: var(--warn); }
  .pid { font-size: 2.3rem; font-weight: 700; letter-spacing: .12em; text-align: center; }
  .status { min-height: 1.6em; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="s-welcome" hidden>
    <h1 tabindex="-1" data-t="welcome_title"></h1>
    <p data-t="welcome_body"></p>
    <p data-t="welcome_mic"></p>
    <button type="button" class="primary" id="b-consent" data-t="consent_btn"></button>
    <button type="button" id="b-lang"></button>
  </section>

  <section id="s-storage" hidden>
    <h1 tabindex="-1" id="st-title" class="warn"></h1>
    <button type="button" class="primary" id="b-reload" data-t="retry"></button>
    <button type="button" id="b-partial-s" data-t="partial_btn" hidden></button>
  </section>

  <section id="s-mic" hidden>
    <h1 tabindex="-1" id="mic-title"></h1>
    <button type="button" class="primary" id="b-retry" data-t="retry"></button>
  </section>

  <section id="s-notice" hidden>
    <h1 tabindex="-1" data-t="notice_persist"></h1>
    <button type="button" class="primary" id="b-notice" data-t="continue"></button>
  </section>

  <section id="s-resume" hidden>
    <h1 tabindex="-1" data-t="resume_title"></h1>
    <button type="button" class="primary" id="b-continue" data-t="continue"></button>
  </section>

  <section id="s-vision" hidden>
    <h1 tabindex="-1" data-t="vision_title"></h1>
    <button type="button" class="primary" data-vision="total" data-t="vision_total"></button>
    <button type="button" class="primary" data-vision="light_perception" data-t="vision_light"></button>
    <button type="button" class="primary" data-vision="low_vision" data-t="vision_low"></button>
  </section>

  <section id="s-prompt" hidden>
    <h1 tabindex="-1" id="p-title"></h1>
    <p id="p-say" class="say"></p>
    <p id="p-stop" data-t="stop_hint"></p>
    <p id="rec" class="rec" aria-hidden="true" hidden></p>
    <!-- One constant accessible name for both states: a changing label would be re-announced into the open mic. -->
    <button type="button" class="primary huge" id="b-start" data-t="start_btn"></button>
    <button type="button" id="b-hear" data-t="hear_btn"></button>
    <button type="button" id="b-partial-p" data-t="partial_btn"></button>
  </section>

  <section id="s-practice" hidden>
    <h1 tabindex="-1" data-t="practice_review"></h1>
    <button type="button" class="primary" id="b-pr-go" data-t="practice_go"></button>
    <button type="button" id="b-pr-again" data-t="practice_again"></button>
    <button type="button" id="b-pr-listen" data-t="listen"></button>
  </section>

  <section id="s-review" hidden>
    <h1 tabindex="-1" id="r-title"></h1>
    <button type="button" class="primary" id="b-next" data-t="next"></button>
    <button type="button" id="b-again" data-t="again"></button>
    <button type="button" id="b-listen" data-t="listen"></button>
    <button type="button" id="b-partial-r" data-t="partial_btn"></button>
  </section>

  <section id="s-break" hidden>
    <h1 tabindex="-1" data-t="break_title"></h1>
    <button type="button" class="primary" id="b-yes" data-t="yes"></button>
    <button type="button" id="b-no" data-t="no"></button>
  </section>

  <section id="s-finish" hidden>
    <h1 tabindex="-1" id="f-title"></h1>
    <p id="f-body"></p>
    <p data-t="pid_label"></p>
    <p class="pid" id="pid" lang="en" dir="ltr"></p>
    <button type="button" class="primary" id="b-send" aria-disabled="true"></button>
    <a class="btn" id="dl" hidden data-t="download"></a>
    <button type="button" id="b-back" data-t="back" hidden></button>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>
</main>

<script>
'use strict';
/* PaldiBlind Voice Survey, web version. Same prompts, ids and manifest fields as the Android
   survey (app/stt_recorder). Everything stays on the phone until the participant presses Send.
   Tap-to-stop recording: the same big button starts and stops; its accessible name never changes.
   The page never speaks on its own: the screen reader reads the focused, lang-tagged heading.
   The mic is opened inside each Start tap and closed right after, so iOS returns to normal
   speaker playback (an open mic puts it in the quiet "phone call" route). */

const APP_VERSION = '1.2.0-web';
const PRE_TONE_MS = 400;         // after cancelling speech, before the start tone
const POST_TONE_GAP_MS = 150;    // start tone fully ended before the mic opens
const MAX_MS = 20000;            // safety cap: auto-stop
const TAIL_TRIM_MS = 350;        // drop the stop tap (screen-reader double-tap click)
const MIN_MS = 600;              // shorter than this after trimming = "too short"
const STALL_MS = 1500;           // no audio for this long while recording = interrupted
const QUIET_PEAK = 0.02;         // below this the clip is treated as near-empty
const CLIP_LEVEL = 0.999, CLIP_COUNT = 20;
const PER_LANGUAGE = 17;
const RESAMPLE_METHOD = 'windowed-sinc FIR low-pass (63 taps, Blackman, 7.2 kHz cutoff) + linear interpolation to 16 kHz; passthrough when the input is 16 kHz';
const SHUFFLE_METHOD = 'mulberry32(seed + 1 for ar, seed + 2 for en), Fisher-Yates in Dart List.shuffle order; names shuffled, hard cases appended in fixed order';

// Copied verbatim from app/stt_recorder/lib/models/destination_info.dart.

  { id: 'faculty_of_law_annex', en: 'Faculty of Law Annex', ar: 'ملحق كلية الحقوق' },

  { id: 'main_cafeteria', en: 'Main Cafeteria', ar: 'الكافيتيريا الرئيسية' },
];
// Copied verbatim from app/stt_recorder/lib/recorder/prompt_plan.dart.

// UI strings: [English, Arabic].
const S = {

  welcome_body: ['You will record yourself saying 12 place names and a few short phrases. It takes about 10 minutes: one practice, then Arabic, then English if you want. The recordings go only to the PaldiBlind research team. You can stop at any time. Please sit in a quiet room and turn on Do Not Disturb. Press the record button, wait for the tone, speak, then press the same button again to stop. There is no time limit.',

  retry: ['Try again', 'حاول مرة أخرى'],
  resume_title: ['Welcome back. Your recordings are saved on this phone. Press Continue to go on from where you stopped.',

  continue: ['Continue', 'متابعة'],

  practice_title: ['Practice: after the tone say: Hello, then press to stop.', 'تجربة: بعد الصفارة قل: مرحبًا، ثم اضغط للإيقاف.'],

                'اضغط الزر أدناه واختر واتساب أو تطبيقًا آخر لإرسال التسجيلات إلى الفريق. يمكنك الإرسال مرة أخرى لاحقًا.'],

                 'اضغط زر الإرسال واختر واتساب أو تطبيقًا آخر. بعدها يمكنك العودة ومتابعة التسجيل.'],

               'المشاركة غير متاحة. استخدم زر تنزيل الملف ثم أرسله من تطبيق الملفات.'],

};

// ---------- state ----------
let ui = 'ar';
let st = null;          // persisted: {pid, seed, ui, consent, consentAt, vision, practiceDone, continueEnglish, persisted, noticeShown, createdAt}
let plan = null;        // {ar: [...17], en: [...17]}
let clips = [];         // saved clip metadata (no audio): {clip_id, seq, base_prompt_id, lang, meta}
let cur = null;         // {prompt, index, practice}
let pending = null;     // capture waiting for Next / Record again (kept in memory if saving fails)
let practicePcm = null; // practice recording: played back, never saved or exported
let busy = false;       // set synchronously by every handler that awaits
let gen = 0;            // navigation generation; stale focus/playback callbacks check it
let storageBlocked = false;
const Z = { gen: 0, state: 'idle', ready: null, partial: false };   // send-screen zip
const A = { ctx: null, stream: null, src: null, node: null, sink: null, mode: null, trackRate: null,
            onCap: null, capN: 0, capId: 0, abort: null, rec: null, op: null, speechUnlocked: false, player: null };

const $ = (id) => document.getElementById(id);
const t = (k) => (ui === 'ar' ? S[k][1] : S[k][0]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function setLang(el, lang) { el.lang = lang; el.dir = lang === 'ar' ? 'rtl' : 'ltr'; }
function setText(el, text, lang) { el.textContent = text; setLang(el, lang || ui); }

// ---------- prompt plan (mirrors PromptPlan._buildLanguageBatch, includeBackgroundSpeech: false) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function firstHalf(name) {
  const words = name.split(/\s+/).filter(Boolean);
  if (words.length < 2) return name;
  return words.slice(0, Math.floor(words.length / 2)).join(' ');
}
function buildBlock(lang, seed) {
  const rng = mulberry32(seed + (lang === 'ar' ? 1 : 2));
  const d = DESTS.slice();
  for (let n = d.length; n > 1;) { const pos = Math.floor(rng() * n); n--; const tmp = d[n]; d[n] = d[pos]; d[pos] = tmp; }
  const nm = (x) => (lang === 'ar' ? x.ar : x.en);

  $('b-back').hidden = !partial || storageBlocked;
  show('s-finish');
  setSendState('preparing');
  prepareZip(partial ? pending : null).then((z) => {
    if (g !== Z.gen) return;
    Z.ready = z;
    setSendState(z ? 'ready' : 'empty');
  }).catch(() => { if (g === Z.gen) setSendState('failed'); });
}
function showMic(err) {
  const unsupported = err && /no-(getusermedia|audiocontext)/.test(err.message || '');
  setText($('mic-title'), t(unsupported ? 'unsupported' : 'mic_title'));
  show('s-mic');
}
function showStorage(key) {
  storageBlocked = true;
  setText($('st-title'), t(key));
  $('b-partial-s').hidden = !(st && clips.length);
  show('s-storage');
}

// ---------- actions (each locks synchronously before its first await) ----------
// Asks once whether storage is persistent; route() then shows the disclosure until it is acknowledged.
async function checkPersist() {
  let persisted = false;
  try { persisted = !!(navigator.storage && navigator.storage.persist && (await navigator.storage.persist())); } catch (e) { persisted = false; }
  st.persisted = persisted;
  await saveState();
}
async function onConsent() {
  if (busy) return;
  busy = true;
  gestureUnlock();
  try {
    st.consent = true; st.consentAt = new Date().toISOString(); st.ui = ui;
    if (!(await saveState())) { showStorage('storage_unusable'); return; }
    await checkPersist();                  // before the mic, so a mic denial cannot skip it
    // Ask for the microphone now (a tap), then close it again until the first Start.
    const op = { kind: 'consent', cancelled: false };
    A.op = op;
    let micError = null;
    try { await openMic(op); } catch (e) { micError = e; }
    releaseMic();
    if (A.op === op) A.op = null;
    if (micError && !op.cancelled) { showMic(micError); return; }
    route();
  } finally { busy = false; }
}
async function onContinue() {
  if (busy) return;
  busy = true;
  gestureUnlock();
  try { if (st.persisted === undefined) await checkPersist(); route(); } finally { busy = false; }
}
async function onNotice() {
  if (busy) return;
  busy = true;
  try { st.noticeShown = true; await saveState(); route(); } finally { busy = false; }
}
async function onVision(value) {
  if (busy) return;
  busy = true;
  try { st.vision = value; await saveState(); route(); } finally { busy = false; }
}
async function onLanguageBreak(yes) {
  if (busy) return;
  busy = true;
  try { st.continueEnglish = yes; await saveState(); route(); } finally { busy = false; }
}
async function onLangToggle() {
  if (busy) return;
  busy = true;
  try { ui = ui === 'ar' ? 'en' : 'ar'; st.ui = ui; await saveState(); applyTexts(); show('s-welcome'); } finally { busy = false; }
}
function onHear() {
  if (busy || !cur) return;
  cancelSpeech();
  const p = cur.prompt;
  const parts = cur.practice ? [[t('practice_title'), ui]]
    : [[PREFIX[ui][p.condition], ui], [p.utterance, p.lang], [p.utterance ? t('stop_hint') : '', ui]];
  if (!speakNow(parts)) status(t('no_voice'));
}
// First tap: start. A tap during startup (mic opening, countdown, start tone): cancel.
// A tap while recording: stop. The button's label is the same in every state.
async function onStart() {
  if (A.rec) { A.rec.stop(); return; }
  if (A.op && A.op.kind === 'start') { interrupt('tap'); return; }
  if (busy || !cur) return;
  busy = true;
  ++gen;                                   // stale focus/playback/status callbacks can no longer fire
  const op = { kind: 'start', cancelled: false, armed: false, reason: null };
  A.op = op;                               // pagehide / visibilitychange / track / context / tap cancel this
  gestureUnlock();
  const c = cur, p = c.prompt;
  const back = (key) => {
    if (A.op === op) A.op = null;
    resetRecordVisual();
    releaseMic();
    if (key === 'capture_fail' && op.reason === 'tap') key = 'cancelled';
    if (c.practice) showPractice(key); else showPrompt(p.lang, c.index, key);
  };
  try {
    cancelSpeech(); stopPlayback();
    try { await openMic(op); } catch (e) { releaseMic(); if (op.cancelled) back('capture_fail'); else { A.op = null; showMic(e); } return; }
    if (op.cancelled) return back('capture_fail');
    if (A.ctx.state !== 'running') await A.ctx.resume().catch(() => {});
    if (op.cancelled || A.ctx.state !== 'running' || !micAlive()) return back('capture_fail');
    op.armed = true;
    await sleep(PRE_TONE_MS);
    if (op.cancelled) return back('capture_fail');
    await waitSpeechIdle(2000);
    if (op.cancelled) return back('capture_fail');
    // Visual only (aria-hidden + colour); no announcement while the mic is open.
    $('rec').hidden = false; $('b-start').classList.add('recording');
    await tone(880, 150);
    if (op.cancelled) return back('capture_fail');
    await sleep(POST_TONE_GAP_MS);
    if (op.cancelled) return back('capture_fail');
    const r = await capture(MAX_MS);
    const alive = micAlive();
    op.armed = false;
    if (r.ok && !op.cancelled && alive && A.op === op) A.op = null;   // done: later taps hit the busy guard
    releaseMic();                          // back to normal speaker playback before the stop tone
    resetRecordVisual();
    if (!r.ok || op.cancelled || !alive) return back('capture_fail');
    await tone(440, 200);
    const x = r.x.subarray(0, Math.max(0, r.x.length - Math.round((TAIL_TRIM_MS / 1000) * r.sr)));
    if (x.length < (MIN_MS / 1000) * r.sr) return back('too_short');
    if (c.practice) { practicePcm = resample16k(x, r.sr); showPracticeReview(); return; }
    let peak = 0, clippedCount = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > peak) peak = a; if (a >= CLIP_LEVEL) clippedCount++; }
    const noWords = p.condition === 'silence' || p.condition === 'mumble';
    pending = { prompt: p, index: c.index, pcm: resample16k(x, r.sr), sr: r.sr, stopReason: r.reason, peak, clippedCount,
                quiet: !noWords && peak < QUIET_PEAK, clipped: !noWords && clippedCount >= CLIP_COUNT };
    showReview();
  } catch (e) {
    back('capture_fail');
  } finally {
    if (A.op === op) A.op = null;
    busy = false;
  }
}
function makeRecord(r, seq) {
  const p = r.prompt;
  const clipId = `web_${st.pid}_${p.lang}_${String(seq).padStart(3, '0')}_${slug(p)}`;
  const meta = {
    clip_id: clipId, file: `${clipId}.wav`, language: p.lang, expected: p.expected,
    prompt_id: `${st.pid}_${p.promptId}`, condition: p.condition, prompt_text: p.utterance, vocab_risk: false,
    ...(p.target ? { target_destination: p.target } : {}),
    duration_ms: Math.round(r.pcm.length / 16), peak: Number(Math.min(1, r.peak).toFixed(4)), clipped_samples: r.clippedCount,
    recorded_at: new Date().toISOString(), conditions_source: 'self-guided web survey; room and mic distance not recorded',
    operator: 'web', speaker: st.pid, participant_group: 'blind', consent_recorded: true,
    vision_level: st.vision, vision_onset: null,
    self_guided: true, recording_mode: 'tap_to_stop', window_ms: null, max_ms: MAX_MS, tail_trim_ms: TAIL_TRIM_MS,
    stop_reason: r.stopReason, platform: 'web', user_agent: navigator.userAgent,
    group: 'blind', actual_sample_rate: r.sr, track_sample_rate: A.trackRate, capture_node: A.mode,
    resample_method: RESAMPLE_METHOD, levels_measured_at: 'input rate, after the tail trim, before resampling',
    level_warning: r.quiet ? 'near_empty' : r.clipped ? 'clipped' : null,
    prompt_seed: st.seed, prompt_index: r.index, ui_language: ui,
  };
  return { clip_id: clipId, seq, base_prompt_id: p.promptId, lang: p.lang, meta, wav: wavBytes(r.pcm).buffer };
}
async function onNext() {
  if (busy || !pending) return;
  busy = true;
  try {
    const rec = makeRecord(pending, clips.length);
    try { await clipPut(rec); } catch (e) { showReview('save_fail_hint'); return; }   // pending stays in memory
    clips.push(stripWav(rec));
    pending = null;
    route();
  } finally { busy = false; }
}
function onAgain() {
  if (busy || !pending) return;
  const r = pending;
  stopPlayback();
  showPrompt(r.prompt.lang, r.index);
}
function onListen() { if (!busy && pending) playPcm(pending.pcm); }
function onPracticeListen() { if (!busy && practicePcm) playPcm(practicePcm); }
function onPracticeAgain() { if (!busy) { stopPlayback(); showPractice(); } }
async function onPracticeGo() {
  if (busy) return;
  busy = true;
  try { stopPlayback(); practicePcm = null; st.practiceDone = true; await saveState(); route(); } finally { busy = false; }
}
function onPartial() { if (!busy) showSend(true); }
function onBack() {
  if (busy) return;
  if (pending) showReview(); else route();
}
// Recoverable clips from storage plus an unsaved pending clip. Resolves null when there is nothing to send.
async function prepareZip(extra) {
  let all = [];
  try { all = await clipAll(); } catch (e) { if (!extra) throw e; all = []; }   // unreadable storage: send the pending clip alone
  all.sort((a, b) => a.seq - b.seq);
  if (extra) all.push(makeRecord(extra, all.length));
  if (!all.length) return null;
  const now = new Date();
  const enc = new TextEncoder();
  const manifest = {
    corpus_id: `paldiblind-survey-web-${st.pid}`,
    recorder: { tool: 'PaldiBlind Voice Survey (web)', format: '16 kHz mono PCM16 WAV, written by the page itself', written_at: now.toISOString() },
    survey: {
      participant_id: st.pid, self_guided: true, recording_mode: 'tap_to_stop', platform: 'web', user_agent: navigator.userAgent,
      group: 'blind', vision_level: st.vision, consent_at: st.consentAt || null, continue_english: st.continueEnglish,
      storage_persisted: st.persisted === true, partial_export: Z.partial, includes_unsaved_clip: !!extra,
      seed: st.seed, shuffle: SHUFFLE_METHOD,
      order: { ar: plan.ar.map((p) => p.promptId), en: plan.en.map((p) => p.promptId) },
      max_ms: MAX_MS, tail_trim_ms: TAIL_TRIM_MS, min_ms: MIN_MS, practice_prompt: 'not recorded in the corpus',
      audio_session_api: !!navigator.audioSession, mic_opened_per_recording: true,
      actual_sample_rate: A.ctx ? A.ctx.sampleRate : null, track_sample_rate: A.trackRate, resample_method: RESAMPLE_METHOD,
    },
    clips: all.map((c) => c.meta),
  };
  const info = { app: 'PaldiBlind Voice Survey (web)', app_version: APP_VERSION, operator: 'web', participant: st.pid,
                 exported_at: now.toISOString(), device_model: 'web', user_agent: navigator.userAgent, clip_count: all.length };
  const files = [{ name: 'manifest.json', data: enc.encode(JSON.stringify(manifest, null, 2)) }];
  for (const c of all) files.push({ name: c.meta.file, data: new Uint8Array(c.wav) });
  files.push({ name: 'export_info.json', data: enc.encode(JSON.stringify(info, null, 2)) });
  const blob = zipStore(files, now);
  const name = `paldiblind_survey_${st.pid}_${stamp(now)}.zip`;
  let file = null;
  try { file = new File([blob], name, { type: 'application/zip' }); } catch (e) { file = null; }
  return { blob, name, file };
}
function offerDownload(z) {
  const a = $('dl');
  if (a.href) URL.revokeObjectURL(a.href);
  a.href = URL.createObjectURL(z.blob);
  a.download = z.name;
  a.hidden = false;
  status(t('share_fail'));
  requestAnimationFrame(() => a.focus());
}
// No await before share(): the zip is already built, so the tap's user activation is still valid.
function onSend() {
  if (Z.state !== 'ready') {
    if (Z.state === 'failed') showSend(Z.partial);
    else setSendState(Z.state);          // re-announce "preparing" / "nothing to send"
    return;
  }
  const z = Z.ready;
  let ok = false;
  try { ok = !!(z.file && navigator.share && navigator.canShare && navigator.canShare({ files: [z.file] })); } catch (e) { ok = false; }
  if (!ok) { offerDownload(z); return; }
  navigator.share({ files: [z.file], title: `PaldiBlind voice survey ${st.pid}` })
    .then(() => status(t('sent')))
    .catch((e) => { if (e && e.name === 'AbortError') status(t('share_cancel')); else offerDownload(z); });
}

// ---------- wiring ----------
document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('button, a')) { cancelSpeech(); if (!busy) stopPlayback(); }
}, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelSpeech(); interrupt('hidden'); } });
window.addEventListener('pagehide', () => { cancelSpeech(); interrupt('hidden'); });
$('b-consent').addEventListener('click', onConsent);
$('b-lang').addEventListener('click', onLangToggle);
$('b-retry').addEventListener('click', onContinue);
$('b-continue').addEventListener('click', onContinue);
$('b-notice').addEventListener('click', onNotice);
$('b-reload').addEventListener('click', () => location.reload());
for (const b of document.querySelectorAll('[data-vision]')) b.addEventListener('click', () => onVision(b.dataset.vision));
$('b-start').addEventListener('click', onStart);
$('b-hear').addEventListener('click', onHear);
$('b-next').addEventListener('click', onNext);
$('b-again').addEventListener('click', onAgain);
$('b-listen').addEventListener('click', onListen);
$('b-pr-listen').addEventListener('click', onPracticeListen);
$('b-pr-again').addEventListener('click', onPracticeAgain);
$('b-pr-go').addEventListener('click', onPracticeGo);
for (const id of ['b-partial-p', 'b-partial-r', 'b-partial-s']) $(id).addEventListener('click', onPartial);
$('b-back').addEventListener('click', onBack);
$('b-yes').addEventListener('click', () => onLanguageBreak(true));
$('b-no').addEventListener('click', () => onLanguageBreak(false));
$('b-send').addEventListener('click', onSend);

function newState() {
  const r = new Uint32Array(1);
  window.crypto.getRandomValues(r);
  const digits = String(r[0] % 1000000).padStart(6, '0');
  return { pid: `W${digits}`, seed: parseInt(digits, 10), ui: 'ar', consent: false, vision: null, practiceDone: false,
           continueEnglish: null, createdAt: new Date().toISOString() };
}
// Saved clips but no state record: rebuild the identity from the clips, never invent a new one.
function stateFromClips(list) {
  const m = list[0].meta;
  return { pid: m.speaker, seed: m.prompt_seed, ui: m.ui_language || 'ar', consent: true, vision: m.vision_level, practiceDone: true,
           continueEnglish: list.some((c) => c.lang === 'en') ? true : null, createdAt: m.recorded_at, recovered: true };
}
async function boot() {
  applyTexts();
  if (!window.indexedDB) { showStorage('storage_unusable'); return; }
  let saved, all;
  try {
    saved = await kvGet('state');
    all = await clipAll();
  } catch (e) {
    // Open failed -> unusable; open worked but a read failed -> data may exist. Either way nothing is written.
    showStorage(dbPromise ? 'storage_read_fail' : 'storage_unusable');
    return;
  }
  clips = all.map(stripWav);
  st = saved || (clips.length ? stateFromClips(clips) : newState());
  ui = st.ui || 'ar';
  plan = { ar: buildBlock('ar', st.seed), en: buildBlock('en', st.seed) };
  applyTexts();
  // Probe that writes work before anything can be recorded.
  if (!(await saveState())) { showStorage('storage_unusable'); return; }
  if (!st.consent) show('s-welcome'); else show('s-resume');
}
boot();
</script>
